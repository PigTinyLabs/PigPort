[package]
name = "pigport-ipa"
version = "0.1.0"
edition = "2021"
description = "PigPort IPA for Apple Silicon"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }

[profile.release]
strip = true
lto = "thin"
