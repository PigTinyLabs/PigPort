<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="body" cx="0.45" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFD3DF"/>
      <stop offset="1" stop-color="#F48FB1"/>
    </radialGradient>
    <linearGradient id="snout" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F48AAA"/>
      <stop offset="1" stop-color="#E06890"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2A1460" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Just the pig controller on a transparent canvas -->
  <g transform="translate(512 500) scale(1.25) translate(-512 -542)">
    <g filter="url(#shadow)">
      <!-- pig ears on top of the controller -->
      <path d="M318 418 C 286 360, 290 300, 324 282 C 362 266, 420 312, 452 392 Z" fill="#F48FB1"/>
      <path d="M706 418 C 738 360, 734 300, 700 282 C 662 266, 604 312, 572 392 Z" fill="#F48FB1"/>
      <path d="M338 396 C 320 360, 322 326, 342 316 C 364 308, 398 338, 418 384 Z" fill="#E0708F"/>
      <path d="M686 396 C 704 360, 702 326, 682 316 C 660 308, 626 338, 606 384 Z" fill="#E0708F"/>

      <!-- controller body -->
      <path d="M300 400
               C 336 378, 404 370, 446 380
               L 578 380
               C 620 370, 688 378, 724 400
               C 800 444, 842 560, 862 664
               C 878 752, 834 802, 784 790
               C 748 782, 722 742, 690 704
               C 670 680, 648 670, 618 670
               L 406 670
               C 376 670, 354 680, 334 704
               C 302 742, 276 782, 240 790
               C 190 802, 146 752, 162 664
               C 182 560, 224 444, 300 400 Z"
            fill="url(#body)"/>
    </g>

    <!-- d-pad on the left grip -->
    <rect x="270" y="500" width="28" height="92" rx="8" fill="#FFFFFF" opacity="0.95"/>
    <rect x="238" y="532" width="92" height="28" rx="8" fill="#FFFFFF" opacity="0.95"/>

    <!-- buttons on the right grip -->
    <circle cx="728" cy="520" r="20" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="772" cy="562" r="20" fill="#FFFFFF" opacity="0.95"/>

    <!-- pig eyes -->
    <ellipse cx="444" cy="478" rx="26" ry="31" fill="#2B1B3A"/>
    <ellipse cx="580" cy="478" rx="26" ry="31" fill="#2B1B3A"/>
    <circle cx="453" cy="466" r="9" fill="#FFFFFF"/>
    <circle cx="589" cy="466" r="9" fill="#FFFFFF"/>

    <!-- cheeks -->
    <ellipse cx="398" cy="566" rx="30" ry="18" fill="#F06A96" opacity="0.45"/>
    <ellipse cx="626" cy="566" rx="30" ry="18" fill="#F06A96" opacity="0.45"/>

    <!-- pig snout -->
    <ellipse cx="512" cy="566" rx="78" ry="54" fill="url(#snout)"/>
    <ellipse cx="486" cy="566" rx="13" ry="20" fill="#8E2A50"/>
    <ellipse cx="538" cy="566" rx="13" ry="20" fill="#8E2A50"/>

    <!-- smile -->
    <path d="M488 640 Q 512 658 536 640" fill="none" stroke="#2B1B3A" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
