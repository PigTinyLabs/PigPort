name: Release

# Push a tag such as v0.2.2 to build macOS (Apple silicon + Intel) and Windows installers
# and publish them as a GitHub release. Signing setup: see build.yml.

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: PigPort ${{ github.ref_name }}
          files: artifacts/*
          fail_on_unmatched_files: false
          body: |
            ### 📥 Downloads

            | Platform | Installer File | Supported Games |
            |---|---|---|
            | **Mac Apple Silicon (M1/M2/M3/M4)** | `PigPort-${{ github.ref_name }}-mac-arm64.dmg` | **Both iOS (IPA)** and **Android (APK/XAPK)** |
            | **Mac Intel (x64)** | `PigPort-${{ github.ref_name }}-mac-x64.dmg` | Android (APK/XAPK) |
            | **Windows (x64)** | `PigPort-${{ github.ref_name }}-win-x64.exe` or portable `.zip` | Android (APK/XAPK) |

            ---

            ### ⚠️ First-time Launch Instructions
            - **macOS:** Open the app. If blocked by Gatekeeper, go to **System Settings → Privacy & Security**, scroll down to Security, and click **Open Anyway** (or run `xattr -cr /Applications/PigPort.app`).
            - **Windows:** If SmartScreen displays "Windows protected your PC", click **More info → Run anyway**.
