name: Nightly

# Every push to main builds macOS (Apple silicon + Intel) and Windows installers and
# publishes them as a "nightly" pre-release. Run it by hand from the Actions tab too.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")-nightly.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PigPort Nightly ${{ needs.version.outputs.version }}
          prerelease: true
          files: artifacts/*
          fail_on_unmatched_files: false
          body: |
            Bản build tự động từ nhánh `main` (commit ${{ github.sha }}). Bản thử nghiệm, có thể còn lỗi.

            | Máy | File |
            |---|---|
            | Mac chip Apple (M1/M2/M3/M4) | `PigPort-…-mac-arm64.dmg` — chơi được game iOS (IPA) và Android |
            | Mac chip Intel | `PigPort-…-mac-x64.dmg` — chỉ game Android (APK) |
            | Windows | `PigPort-…-win-x64.exe` (cài đặt) hoặc bản portable |

            Nếu bản này chưa được ký bằng chứng chỉ trả phí:
            - **macOS:** mở app lần đầu, macOS sẽ chặn. Vào **System Settings → Privacy & Security**, kéo xuống và bấm **Open Anyway**.
            - **Windows:** SmartScreen hiện "Windows protected your PC" → bấm **More info** → **Run anyway**.
