name: Build

# Shared by release.yml and nightly.yml: builds the macOS (Apple silicon + Intel) and
# Windows installers and uploads them as artifacts.
#
# Signing secrets are optional; without them the builds are unsigned (macOS ad-hoc signed).
# macOS: MAC_CERTS (base64 of a Developer ID Application .p12), MAC_CERTS_PASSWORD,
#        APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarization)
# Windows: WIN_CERTS (base64 of a code-signing .pfx), WIN_CERTS_PASSWORD

on:
  workflow_call:
    inputs:
      version:
        description: Version to stamp into the app; empty keeps package.json
        type: string
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      PIGPORT_TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$PIGPORT_TARGET"

      - name: Install dependencies
        run: npm ci

      - name: Fetch scrcpy-server
        run: npm run fetch:scrcpy-server

      - name: Set version
        if: inputs.version != ''
        shell: bash
        env:
          PIGPORT_VERSION: ${{ inputs.version }}
        run: npm version "${PIGPORT_VERSION#v}" --no-git-tag-version --allow-same-version

      - name: Signing certificate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_CERTS: ${{ secrets.WIN_CERTS }}
          WIN_CERTS_PASSWORD: ${{ secrets.WIN_CERTS_PASSWORD }}
        run: |
          if (-not $env:WIN_CERTS) { exit 0 }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'win-cert.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WIN_CERTS))
          try {
            $password = ConvertTo-SecureString $env:WIN_CERTS_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password |
              Where-Object HasPrivateKey | Select-Object -First 1
            if (-not $certificate) { throw 'The Windows signing certificate has no private key.' }
            @{
              bundle = @{ windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = 'http://timestamp.digicert.com'
                tsp = $true
              } }
            } | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $env:RUNNER_TEMP 'tauri-windows-signing.json')
          } finally {
            Remove-Item -LiteralPath $certificatePath
          }

      - name: Test
        if: runner.os == 'macOS'
        run: npm test

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.MAC_CERTS }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          flags=()
          if [ -n "$APPLE_CERTIFICATE" ]; then
            # Drop the local ad-hoc default so Tauri can use the imported Developer ID.
            flags+=(--config '{"bundle":{"macOS":{"signingIdentity":null}}}')
          else
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
          fi
          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npm run dist:mac -- --target "$PIGPORT_TARGET" "${flags[@]}"

      # AirPlay receiver for viewing an iPhone screen on Windows (UxPlay, GPLv3).
      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav

      - name: Build AirPlay receiver (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-uxplay-windows.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'tauri-windows-signing.json'
          $flags = @('--target', $env:PIGPORT_TARGET)
          if (Test-Path $config) { $flags += @('--config', $config) }
          npm run dist:win -- @flags

      - name: Test Rust desktop
        shell: bash
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --target "$PIGPORT_TARGET"

      - name: Stage release files
        run: node scripts/stage-release.mjs ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: pigport-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
